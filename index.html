<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Isla — you look good in pink.</title>

    <!-- Our stylesheet -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- =========================
         LANDING / COVER
    ========================== -->

    <section id="landing" class="screen">

        <div class="landing-content">

            <p class="small-date">
                27 · 09 · 2026
            </p>


            <h1>
                ISLA
            </h1>


            <p class="album-title">
                YOU LOOK GOOD IN PINK.
            </p>


            <div class="divider"></div>


            <p class="description">
                a little place where all my thoughts,
                memories and feelings meet.
            </p>


            <button
                class="enter-button"
                onclick="enterSite()"
            >

                ENTER

            </button>

        </div>

    </section>



    <!-- =========================
         LETTER / ENVELOPE
    ========================== -->

    <section
        id="letter-screen"
        class="screen hidden"
    >

        <div class="letter-content">

            <p class="letter-intro">
                I made something for you.
            </p>


            <div
                class="envelope-container"
                id="envelope"
                onclick="openLetter()"
            >

                <div class="envelope">

                    <!-- Letter -->

                    <div class="letter">

                        <h2>
                            Isla
                        </h2>

                        <p>
                            There is something I have
                            been wanting to tell you.
                        </p>

                    </div>


                    <!-- Envelope flap -->

                    <div class="flap"></div>


                    <!-- Wax seal -->

                    <div class="seal">
                        ♡
                    </div>

                </div>

            </div>


            <p class="open-text">
                open it.
            </p>

        </div>

    </section>



    <!-- Our JavaScript -->

    <script src="script.js"></script>

</body>

</html>
