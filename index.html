<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Isla</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(circle at center, #211820 0%, #0b090c 70%);

            color: #eee5e8;

            font-family: Georgia, 'Times New Roman', serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .page {
            text-align: center;
        }

        .date {
            font-size: 12px;
            letter-spacing: 5px;
            opacity: 0.45;
            margin-bottom: 45px;
        }

        .intro {
            font-size: 15px;
            letter-spacing: 2px;
            opacity: 0.6;
            margin-bottom: 35px;
        }

        /* SOBRE */

        .envelope-container {
            position: relative;

            width: 360px;
            height: 240px;

            margin: auto;

            cursor: pointer;

            transition: transform 0.4s ease;
        }

        .envelope-container:hover {
            transform: translateY(-6px);
        }

        .envelope {
            position: relative;

            width: 100%;
            height: 100%;

            background: #21161d;

            border: 1px solid #5a414c;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.6);

            overflow: visible;
        }

        /* PARTE INFERIOR DEL SOBRE */

        .envelope::after {
            content: "";

            position: absolute;

            bottom: 0;
            left: 0;

            width: 0;
            height: 0;

            border-left: 180px solid transparent;
            border-right: 180px solid transparent;

            border-bottom: 125px solid #2c1c25;

            z-index: 3;
        }

        /* SOLAPA */

        .flap {
            position: absolute;

            top: 0;
            left: 0;

            width: 0;
            height: 0;

            border-left: 180px solid transparent;
            border-right: 180px solid transparent;

            border-top: 125px solid #39232e;

            transform-origin: top center;

            transition:
                transform 1s ease,
                z-index 0s linear 0.5s;

            z-index: 5;
        }

        /* CARTA */

        .letter {
            position: absolute;

            width: 85%;
            height: 80%;

            background: #eee7df;

            color: #251c20;

            left: 7.5%;
            top: 12%;

            padding: 30px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.35);

            transform: translateY(40px);

            transition:
                transform 1s ease,
                opacity 0.7s ease;

            opacity: 0;

            z-index: 2;
        }

        .letter h2 {
            margin-top: 5px;

            font-weight: normal;

            letter-spacing: 3px;
        }

        .letter p {
            font-size: 13px;

            line-height: 1.7;

            opacity: 0.75;
        }

        /* SELLO */

        .seal {
            position: absolute;

            width: 58px;
            height: 58px;

            border-radius: 50%;

            background: #5a2638;

            border: 2px solid #8b566b;

            color: #e8cbd5;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            z-index: 10;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.4);

            transition:
                transform 0.6s ease,
                opacity 0.5s ease;
        }

        .hint {
            margin-top: 35px;

            font-size: 12px;

            letter-spacing: 3px;

            opacity: 0.4;

            transition: opacity 0.5s ease;
        }

        /* SOBRE ABIERTO */

        .open .flap {
            transform: rotateX(180deg);

            z-index: 1;
        }

        .open .letter {
            transform: translateY(-90px);

            opacity: 1;

            z-index: 8;
        }

        .open .seal {
            transform:
                translate(-50%, -50%)
                scale(1.3);

            opacity: 0;
        }

        .open .hint {
            opacity: 0;
        }

    </style>
</head>


<body>

    <main class="page">

        <div class="date">
            27 · 09 · 2026
        </div>

        <div class="intro">
            I made something for you.
        </div>


        <!-- SOBRE -->

        <div
            class="envelope-container"
            id="envelope"
            onclick="openLetter()"
        >

            <div class="envelope">

                <!-- CARTA -->

                <div class="letter">

                    <h2>Isla</h2>

                    <p>
                        There is something I have been wanting
                        to tell you.
                    </p>

                </div>


                <!-- SOLAPA -->

                <div class="flap"></div>


                <!-- SELLO -->

                <div class="seal">
                    ♡
                </div>

            </div>

        </div>


        <div class="hint">
            CLICK TO OPEN
        </div>

    </main>


    <script>

        function openLetter() {

            const envelope =
                document.getElementById("envelope");

            envelope.classList.toggle("open");

        }

    </script>

</body>

</html>
